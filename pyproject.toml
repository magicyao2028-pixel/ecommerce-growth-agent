[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-growth-agent"
version = "0.2.0"
description = "An offline, explainable e-commerce operations analysis agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "magicyao2028-pixel" }]
dependencies = []

[project.scripts]
growth-agent = "ecommerce_growth_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
