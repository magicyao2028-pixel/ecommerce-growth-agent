[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-growth-agent"
version = "0.9.0"
description = "An offline, explainable e-commerce operations analysis agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "magicyao2028-pixel" }]
dependencies = []

[project.optional-dependencies]
service = ["fastapi>=0.110", "uvicorn>=0.30"]

[project.scripts]
growth-agent = "ecommerce_growth_agent.cli:main"
growth-agent-eval = "ecommerce_growth_agent.evaluation_cli:main"
growth-agent-trial = "ecommerce_growth_agent.trial_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
